# Databricks Asset Bundle: deploys src/ and the daily ingest job in one step (databricks bundle deploy).
# Deployed by .github/workflows/cd.yml as the service principal; the workspace host and BRONZE_ROOT come from
# GitHub secrets, so this file holds no workspace or storage details.
#
#   databricks bundle validate      check this file
#   databricks bundle deploy        upload src/ and create or update the job
#   databricks bundle run ingest    run the job now
bundle:
  name: media-platform-project

variables:
  bronze_root:
    description: Raw files, abfss://bronze@<account>.dfs.core.windows.net/landing (GitHub secret BRONZE_ROOT).
  silver_root:
    description: The ADLS container silver, abfss://silver@<account>.dfs.core.windows.net (GitHub secret SILVER_ROOT).
  gold_root:
    description: The ADLS container gold, abfss://gold@<account>.dfs.core.windows.net (GitHub secret GOLD_ROOT).
  schedule_status:
    description: UNPAUSED or PAUSED (GitHub variable INGEST_SCHEDULE). Every deploy applies it to the schedule.
    default: UNPAUSED

sync:
  paths:
    - src   # only the code that runs on Databricks; tests, docs and CI/CD stay in GitHub

targets:
  prod:
    default: true
    workspace:
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}   # deployment state of the bundle
      file_path: /Shared/${bundle.name}                              # the code: /Shared/<bundle name>/src

resources:
  jobs:
    ingest:   # keep this key: renaming it would delete the job and create a new one (new id, no run history)
      name: media-platform-pipeline-daily   # the name can change freely: same job, id and run history
      max_concurrent_runs: 1
      # Every change goes through a pull request and CD (cd.yml): the team views and runs the job, nobody edits or
      # deletes it by hand. Each deploy sets these permissions again (the deploying service principal stays owner;
      # workspace admins keep their access), so permissions added by hand in the UI are removed.
      permissions:
        - level: CAN_MANAGE_RUN   # view, run now, cancel, repair; not edit or delete
          group_name: media-platform-team   # workspace group: Admin settings -> Identity and access -> Groups
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"   # every day at 02:00
        timezone_id: Asia/Ho_Chi_Minh   # also the timezone of dt and the batch id (src/ingest/batch.py)
        pause_status: ${var.schedule_status}
      environments:
        - environment_key: default
          spec:
            environment_version: "3"   # serverless, Python 3.12
            dependencies:
              - requests>=2.31,<3
      # One task per table, so the job graph shows the path of the data: source -> bronze -> silver -> gold.
      # The ops tasks come last and monitor every batch. marts_views (re)creates the views read by the dashboard.
      # The TMDB and MusicBrainz paths are independent: when one source fails, the other still reaches silver,
      # and the next run catches up (COPY INTO and silver.load_log only take what is new).
      tasks:
        - task_key: setup_tables   # creates the missing bronze, silver, gold and ops tables (src/sql/)
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 900
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["--set", "BRONZE_ROOT=${var.bronze_root}", "--set", "SILVER_ROOT=${var.silver_root}",
                         "--set", "GOLD_ROOT=${var.gold_root}", "setup"]
        - task_key: ingest_tmdb
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 300000   # 5 minutes
          timeout_seconds: 1800
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["--set", "BRONZE_ROOT=${var.bronze_root}", "ingest", "--source", "tmdb"]
        - task_key: ingest_musicbrainz
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 300000
          timeout_seconds: 1800
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["--set", "BRONZE_ROOT=${var.bronze_root}", "ingest", "--source", "musicbrainz"]
        - task_key: ingest_listenbrainz   # listen counts of the albums known to silver
          depends_on:
            - task_key: silver_release_group
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 300000
          timeout_seconds: 1800
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["--set", "BRONZE_ROOT=${var.bronze_root}", "ingest", "--source", "listenbrainz"]
        - task_key: ingest_wikipedia   # Wikipedia articles (Wikidata) and pageviews of the movies and albums in silver
          depends_on:
            - task_key: silver_movie
            - task_key: silver_release_group
            - task_key: silver_tv_show
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 300000
          timeout_seconds: 3600   # one pageviews request per article, about 10 per second
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["--set", "BRONZE_ROOT=${var.bronze_root}", "ingest", "--source", "wikipedia"]
        - task_key: bronze_tmdb_movies   # COPY INTO from landing/
          depends_on:
            - task_key: ingest_tmdb
            - task_key: setup_tables
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 900
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["--set", "BRONZE_ROOT=${var.bronze_root}", "bronze", "--table", "tmdb_movies"]
        - task_key: bronze_tmdb_trending_movies   # COPY INTO from landing/: rank of the trending movies
          depends_on:
            - task_key: ingest_tmdb
            - task_key: setup_tables
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 900
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["--set", "BRONZE_ROOT=${var.bronze_root}", "bronze", "--table", "tmdb_trending_movies"]
        - task_key: bronze_tmdb_tv_shows   # COPY INTO from landing/: TV shows
          depends_on:
            - task_key: ingest_tmdb
            - task_key: setup_tables
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 900
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["--set", "BRONZE_ROOT=${var.bronze_root}", "bronze", "--table", "tmdb_tv_shows"]
        - task_key: bronze_musicbrainz_release_groups
          depends_on:
            - task_key: ingest_musicbrainz
            - task_key: setup_tables
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 900
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["--set", "BRONZE_ROOT=${var.bronze_root}", "bronze", "--table", "musicbrainz_release_groups"]
        - task_key: bronze_listenbrainz_release_group_popularity
          depends_on:
            - task_key: ingest_listenbrainz
            - task_key: setup_tables
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 900
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["--set", "BRONZE_ROOT=${var.bronze_root}",
                         "bronze", "--table", "listenbrainz_release_group_popularity"]
        - task_key: bronze_wikidata_media_articles
          depends_on:
            - task_key: ingest_wikipedia
            - task_key: setup_tables
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 900
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["--set", "BRONZE_ROOT=${var.bronze_root}", "bronze", "--table", "wikidata_media_articles"]
        - task_key: bronze_wikipedia_pageviews
          depends_on:
            - task_key: ingest_wikipedia
            - task_key: setup_tables
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 900
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["--set", "BRONZE_ROOT=${var.bronze_root}", "bronze", "--table", "wikipedia_pageviews"]
        - task_key: silver_movie   # SCD2, incremental
          depends_on:
            - task_key: bronze_tmdb_movies
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 1800
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["silver", "--table", "movie"]
        - task_key: silver_movie_metric_daily   # incremental
          depends_on:
            - task_key: bronze_tmdb_movies
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 1800
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["silver", "--table", "movie_metric_daily"]
        - task_key: silver_release_group   # SCD2, incremental
          depends_on:
            - task_key: bronze_musicbrainz_release_groups
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 1800
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["silver", "--table", "release_group"]
        - task_key: silver_artist   # SCD2, incremental
          depends_on:
            - task_key: bronze_musicbrainz_release_groups
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 1800
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["silver", "--table", "artist"]
        - task_key: silver_release_group_metric_daily   # incremental: daily ListenBrainz listen counts
          depends_on:
            - task_key: bronze_listenbrainz_release_group_popularity
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 1800
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["silver", "--table", "release_group_metric_daily"]
        - task_key: silver_media_wiki_page   # incremental: the Wikipedia article of each movie and album
          depends_on:
            - task_key: bronze_wikidata_media_articles
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 1800
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["silver", "--table", "media_wiki_page"]
        - task_key: silver_movie_trending_daily   # incremental: daily rank of the movies in TMDB trending
          depends_on:
            - task_key: bronze_tmdb_trending_movies
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 1800
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["silver", "--table", "movie_trending_daily"]
        - task_key: silver_tv_show   # SCD2 of the TV shows
          depends_on:
            - task_key: bronze_tmdb_tv_shows
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 1800
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["silver", "--table", "tv_show"]
        - task_key: silver_tv_show_metric_daily   # incremental
          depends_on:
            - task_key: bronze_tmdb_tv_shows
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 1800
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["silver", "--table", "tv_show_metric_daily"]
        - task_key: silver_tv_show_genre   # full load
          depends_on:
            - task_key: silver_tv_show
            - task_key: silver_genre
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 1800
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["silver", "--table", "tv_show_genre"]
        - task_key: silver_wiki_pageview_daily   # incremental: daily Wikipedia pageviews per article
          depends_on:
            - task_key: bronze_wikipedia_pageviews
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 1800
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["silver", "--table", "wiki_pageview_daily"]
        - task_key: silver_genre   # full load, from the TMDB (movies, TV) and MusicBrainz bronze tables
          depends_on:
            - task_key: bronze_tmdb_movies
            - task_key: bronze_musicbrainz_release_groups
            - task_key: bronze_tmdb_tv_shows
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 1800
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["silver", "--table", "genre"]
        - task_key: silver_movie_genre   # full load
          depends_on:
            - task_key: silver_movie
            - task_key: silver_genre
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 1800
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["silver", "--table", "movie_genre"]
        - task_key: silver_release_group_genre   # full load
          depends_on:
            - task_key: silver_release_group
            - task_key: silver_genre
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 1800
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["silver", "--table", "release_group_genre"]
        - task_key: silver_release_group_artist   # full load
          depends_on:
            - task_key: silver_release_group
            - task_key: silver_artist
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 1800
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["silver", "--table", "release_group_artist"]
        - task_key: gold_dim_date   # full load: the calendar, needs no source
          depends_on:
            - task_key: setup_tables
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 900
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["gold", "--table", "dim_date"]
        - task_key: gold_dim_media   # full load: current movies and albums, with their genres
          depends_on:
            - task_key: silver_movie_genre           # runs after silver_movie and silver_genre
            - task_key: silver_release_group_genre   # runs after silver_release_group and silver_genre
            - task_key: silver_tv_show_genre         # runs after silver_tv_show and silver_genre
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 1800
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["gold", "--table", "dim_media"]
        - task_key: gold_dim_genre   # full load
          depends_on:
            - task_key: silver_genre
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 900
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["gold", "--table", "dim_genre"]
        - task_key: gold_bridge_media_genre   # full load: the genres of each movie and album
          depends_on:
            - task_key: silver_movie_genre
            - task_key: silver_release_group_genre
            - task_key: silver_tv_show_genre
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 1800
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["gold", "--table", "bridge_media_genre"]
        - task_key: gold_fact_media_metric_daily   # full load: daily metrics of movies and albums
          depends_on:
            - task_key: silver_movie_metric_daily
            - task_key: silver_release_group_metric_daily
            - task_key: gold_dim_media   # keeps only the media of the dimension
            - task_key: silver_tv_show_metric_daily
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 1800
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["gold", "--table", "fact_media_metric_daily"]
        - task_key: gold_fact_media_change   # full load: new movies and albums, and changes of their details
          depends_on:
            - task_key: silver_movie
            - task_key: silver_release_group
            - task_key: silver_tv_show
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 1800
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["gold", "--table", "fact_media_change"]
        - task_key: gold_dim_wiki_page   # full load: the Wikipedia article of each movie and album
          depends_on:
            - task_key: silver_media_wiki_page
            - task_key: gold_dim_media
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 900
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["gold", "--table", "dim_wiki_page"]
        - task_key: gold_fact_wiki_pageview_daily   # full load: daily Wikipedia views of movies and albums
          depends_on:
            - task_key: silver_wiki_pageview_daily
            - task_key: gold_dim_wiki_page
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 1800
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["gold", "--table", "fact_wiki_pageview_daily"]
        - task_key: gold_fact_media_trending_daily   # full load: daily rank of the movies in TMDB trending
          depends_on:
            - task_key: silver_movie_trending_daily
            - task_key: gold_dim_media
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 900
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["gold", "--table", "fact_media_trending_daily"]
        - task_key: ops_pipeline_record_metrics   # full load: rows, files and lag of every ingest batch
          depends_on:
            - task_key: silver_movie                        # TMDB
            - task_key: silver_movie_trending_daily
            - task_key: silver_tv_show
            - task_key: silver_release_group_metric_daily   # runs after silver_release_group (MusicBrainz)
            - task_key: silver_media_wiki_page              # Wikipedia
            - task_key: silver_wiki_pageview_daily
          run_if: ALL_DONE   # also when a path failed: its batches show up as not loaded into silver
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 1800
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["ops", "--table", "pipeline_record_metrics"]
        - task_key: ops_data_quality_results   # full load: quality checks of every ingest batch
          depends_on:
            - task_key: ops_pipeline_record_metrics
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 900
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["ops", "--table", "data_quality_results"]
        - task_key: marts_views   # views over gold and ops for the dashboard (Preset); they hold no data
          depends_on:
            - task_key: setup_tables
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 900
          spark_python_task:
            python_file: ./src/pipeline.py
            parameters: ["marts"]
