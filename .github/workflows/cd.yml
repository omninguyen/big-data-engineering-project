# Deploys the Databricks Asset Bundle (databricks.yml): src/ to /Shared/<bundle name>/src and the daily ingest job.
# Runs when a merged pull request changes src/ or databricks.yml (a push to main), or by hand:
# Actions -> cd -> Run workflow. The tests (ci.yml) run first; nothing is deployed if they fail.
#
# Secrets (repository or environment "prod"):
#   DATABRICKS_HOST                                   workspace URL, https://<workspace>.azuredatabricks.net
#   DATABRICKS_CLIENT_ID + DATABRICKS_CLIENT_SECRET   OAuth secret of the deploying service principal
#   BRONZE_ROOT                                       ADLS container bronze, abfss://bronze@<account>.dfs.core.windows.net
# Variable (optional): INGEST_SCHEDULE = UNPAUSED switches the daily schedule on. Default PAUSED.
name: cd

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "databricks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:  # one deploy at a time, never cancel one halfway
  group: cd-prod
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'   # a manual run on another branch only tests
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 15
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_AUTH_TYPE: oauth-m2m   # service principal only, no personal access token
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      BUNDLE_VAR_bronze_root: ${{ secrets.BRONZE_ROOT }}
      BUNDLE_VAR_schedule_status: ${{ vars.INGEST_SCHEDULE || 'PAUSED' }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main   # pin a release tag for reproducible deploys

      - name: Check secrets
        run: |
          # Secret values stay masked in the log.
          if [ -z "$DATABRICKS_CLIENT_ID" ] || [ -z "$DATABRICKS_CLIENT_SECRET" ]; then
            echo "::error::Add the secrets DATABRICKS_CLIENT_ID and DATABRICKS_CLIENT_SECRET (service principal)."
            exit 1
          fi
          case "$DATABRICKS_HOST" in
            https://*) ;;
            *) echo "::error::Secret DATABRICKS_HOST is missing or does not start with https://."
               exit 1 ;;
          esac
          case "$BUNDLE_VAR_bronze_root" in
            abfss://*) ;;
            *) echo "::error::Secret BRONZE_ROOT is missing or does not start with abfss://."
               exit 1 ;;
          esac
          case "$BUNDLE_VAR_schedule_status" in
            PAUSED|UNPAUSED) ;;
            *) echo "::error::Variable INGEST_SCHEDULE must be PAUSED or UNPAUSED."
               exit 1 ;;
          esac

      - name: Check the connection
        run: databricks current-user me

      - name: Validate the bundle
        run: databricks bundle validate --target prod

      - name: Deploy src/ and the ingest job
        run: |
          # Uploads src/ (files removed from the repo are removed from the workspace too) and creates or
          # updates the job ${bundle.name}-ingest.
          databricks bundle deploy --target prod
          databricks bundle summary --target prod
