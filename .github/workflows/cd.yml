# Deploys src/ to /Shared/<repository name>/src in the Databricks workspace.
# Runs when a merged pull request changes src/ (a push to main), or by hand: Actions -> cd -> Run workflow.
# The tests (ci.yml) run first; nothing is deployed if they fail.
#
# Secrets: Settings -> Secrets and variables -> Actions -> tab Secrets (not Variables), as repository secrets or
# secrets of the environment "prod":
#   DATABRICKS_HOST                                   workspace URL, https://<workspace>.azuredatabricks.net
#   DATABRICKS_CLIENT_ID + DATABRICKS_CLIENT_SECRET   OAuth secret of the deploying service principal
name: cd

on:
  push:
    branches: [main]
    paths:
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:  # one deploy at a time, never cancel one halfway
  group: cd-prod
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'   # a manual run on another branch only tests
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 15
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_AUTH_TYPE: oauth-m2m   # service principal only, no personal access token
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      TARGET: /Shared/${{ github.event.repository.name }}/src   # follows a rename of the repository
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main   # pin a release tag for reproducible deploys

      - name: Check secrets
        env:
          # true or false, never a value: tells a secret saved by mistake as a variable apart from a missing one
          DATABRICKS_HOST_IS_VARIABLE: ${{ vars.DATABRICKS_HOST != '' }}
          DATABRICKS_CLIENT_ID_IS_VARIABLE: ${{ vars.DATABRICKS_CLIENT_ID != '' }}
          DATABRICKS_CLIENT_SECRET_IS_VARIABLE: ${{ vars.DATABRICKS_CLIENT_SECRET != '' }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Only checks whether each secret is set; the values stay masked in the log.
          missing=0
          for name in DATABRICKS_HOST DATABRICKS_CLIENT_ID DATABRICKS_CLIENT_SECRET; do
            [ -n "${!name}" ] && continue
            missing=1
            as_variable="${name}_IS_VARIABLE"
            if [ "${!as_variable}" = true ]; then
              echo "::error::$name is saved as a variable, not a secret. Delete the variable and add it under Settings > Secrets and variables > Actions > Secrets."
            else
              echo "::error::Secret $name is empty in this job. Add it to $REPOSITORY under Settings > Secrets and variables > Actions > Secrets (repository secret, or secret of the environment prod)."
            fi
          done
          [ "$missing" = 0 ] || exit 1
          case "$DATABRICKS_HOST" in
            https://*) ;;
            *) echo "::error::Secret DATABRICKS_HOST must start with https://, e.g. https://adb-<id>.<n>.azuredatabricks.net."
               exit 1 ;;
          esac
          case "$TARGET" in
            /Shared/[!/]*/src) ;;
            *) echo "::error::Unexpected deploy path $TARGET (repository name missing)."
               exit 1 ;;
          esac

      - name: Check the connection
        run: databricks current-user me

      - name: Deploy src/ to /Shared
        run: |
          # Replace the previous upload, so files removed from the repo disappear from the workspace too.
          if databricks workspace get-status "$TARGET" > /dev/null 2>&1; then
            databricks workspace delete "$TARGET" --recursive
          fi
          databricks workspace mkdirs "$TARGET"
          databricks workspace import-dir src "$TARGET"
          databricks workspace list "$TARGET"
